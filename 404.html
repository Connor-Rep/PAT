<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Safetay Electrical Testing</title>
<meta name="robots" content="noindex">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
	<div class="wrap header-row">
		<a class="brand" href="/">
			<img src="/images/logo.png" alt="Safetay Electrical Testing logo" width="524" height="79">
		</a>
	</div>
</header>

<main>
	<section class="quote-hero">
		<div class="wrap">
			<div class="eyebrow" style="color:#d7f0dc;">404</div>
			<h1>Page not found</h1>
			<p class="lede">Sorry, that page doesn't exist. It may have moved or the link may be out of date.</p>
			<a class="btn" href="/">Back to homepage</a>
		</div>
	</section>
</main>

<footer>
	<div class="wrap">
		<span>&copy; <span id="year"></span> Safetay Electrical Testing</span>
		<span><a href="tel:+447775435872">07775 435 872</a> &middot; <a href="mailto:info@safetaypat.co.uk">info@safetaypat.co.uk</a></span>
	</div>
</footer>

<script>
	// Hold briefly before following an internal link to another page (no
	// visual animation, just a deliberate pause) so navigating the site
	// doesn't feel instantaneous.
	document.addEventListener('click', function (e) {
		if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
		var link = e.target.closest('a');
		if (!link || !link.href || link.target === '_blank') return;
		var url;
		try { url = new URL(link.href); } catch (err) { return; }
		if (url.origin !== window.location.origin) return;
		if (url.pathname === window.location.pathname && url.hash) return;
		e.preventDefault();
		setTimeout(function () { window.location.href = link.href; }, 200);
	});

	document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
